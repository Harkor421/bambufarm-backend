# Railway/Nixpacks build config — adds gcc/unzip/curl to the setup phase so
# the build phase can compile our libbambushim.so against Bambu's signed
# network plugin.

[phases.setup]
nixPkgs = ["nodejs_22", "gcc", "unzip", "curl", "stdenv"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[phases.build]
cmds = [
  "echo '[bambu] Downloading Bambu network plugin (Linux x86_64) v02.06.00.50'",
  "mkdir -p vendor/bambu/linux",
  "curl -L -sS -o /tmp/bambu_linux.zip https://public-cdn.bblmw.com/upgrade/studio/plugins/02.06.00.50/7459f94f40/linux_02.06.00.50.zip",
  "unzip -q -o /tmp/bambu_linux.zip -d vendor/bambu/linux/",
  "ls -lh vendor/bambu/linux/",
  "echo '[bambu] Compiling shim against plugin'",
  "g++ -std=c++17 -shared -fPIC -O2 -o native/bambushim/libbambushim.so native/bambushim/bambushim.cpp -L vendor/bambu/linux -lbambu_networking -Wl,-rpath,'$ORIGIN/../../vendor/bambu/linux'",
  "ls -lh native/bambushim/libbambushim.so",
  "echo '[bambu] Build complete'",
]

[start]
cmd = "node src/index.js"
